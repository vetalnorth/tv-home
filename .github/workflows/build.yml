name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          BUILD_TOOLS_PATH=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          export PATH=$PATH:$BUILD_TOOLS_PATH

          cd launcher
          chmod +x build-and-install.sh
          # Глушим любые попытки скрипта лезть в adb и python
          sed -i 's/adb/# adb/g' build-and-install.sh
          sed -i 's/.*tools\/venv.*/# ignore python/g' build-and-install.sh

          bash build-and-install.sh || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-home-apk
          path: launcher/build/*.apk
